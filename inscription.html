<!DOCTYPE html>
<!-- inscription.html — page d'inscription : panneau d'accroche à gauche,
     formulaire de création de compte à droite. -->
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description"
        content="Messagerie instantanée Web : échangez des messages en temps réel.">
  <title>Inscription - Messagerie</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/authentification.css">
</head>
<body>
  <main class="auth auth--inscription">
    <!-- Panneau d'accroche : nom du site et slogan -->
    <section class="auth__accroche">
      <header>
        <p class="auth__marque">Messagerie</p>
      </header>
      <h1 class="auth__slogan">Inscrivez-vous</h1>
    </section>

    <!-- Formulaire de création de compte -->
    <section class="auth__contenu">
      <h2 class="auth__titre">Inscription</h2>

      <form class="formulaire-auth">
        <div class="champ">
          <label class="champ__label" for="nom-utilisateur">Utilisateur</label>
          <input class="champ__saisie" type="text" id="nom-utilisateur" name="nom-utilisateur"
                 placeholder="thomas.l" autocomplete="username"
                 minlength="3" maxlength="30" required>
        </div>

        <div class="champ">
          <label class="champ__label" for="courriel">Courriel</label>
          <input class="champ__saisie" type="email" id="courriel" name="courriel"
                 placeholder="thomas@exemple.com" autocomplete="email" required>
        </div>

        <div class="champ">
          <label class="champ__label" for="mot-de-passe">Mot de passe</label>
          <input class="champ__saisie" type="password" id="mot-de-passe" name="mot-de-passe"
                 placeholder="8 caractères minimum" autocomplete="new-password"
                 minlength="8" required>
        </div>

        <div class="champ">
          <label class="champ__label" for="confirmation-mot-de-passe">Confirmation</label>
          <input class="champ__saisie" type="password" id="confirmation-mot-de-passe"
                 name="confirmation-mot-de-passe" autocomplete="new-password"
                 minlength="8" required>
        </div>

        <button class="bouton-principal" type="submit">Créer le compte</button>
      </form>

      <p class="auth__lien-bascule">Déjà inscrit ? <a href="connexion.html">Connectez-vous</a></p>
      <p class="auth__mentions">
        En créant un compte, vous acceptez la politique de confidentialité.
      </p>
    </section>
  </main>
</body>
</html>
