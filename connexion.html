<!DOCTYPE html>
<!-- connexion.html — page de connexion : panneau d'accroche à gauche,
     formulaire de connexion à droite. -->
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description"
        content="Messagerie instantanée Web : échangez des messages en temps réel.">
  <title>Connexion - Messagerie</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/authentification.css">
</head>
<body>
  <main class="auth">
    <!-- Panneau d'accroche : nom du site et slogan -->
    <section class="auth__accroche">
      <header>
        <p class="auth__marque">Messagerie</p>
      </header>
      <h1 class="auth__slogan">Connectez-vous</h1>
    </section>

    <!-- Formulaire de connexion -->
    <section class="auth__contenu">
      <h2 class="auth__titre">Connexion</h2>

      <form class="formulaire-auth">
        <div class="champ">
          <label class="champ__label" for="courriel">Courriel</label>
          <input class="champ__saisie" type="email" id="courriel" name="courriel"
                 placeholder="thomas@exemple.com" autocomplete="email" required>
        </div>

        <div class="champ">
          <label class="champ__label" for="mot-de-passe">Mot de passe</label>
          <input class="champ__saisie" type="password" id="mot-de-passe" name="mot-de-passe"
                 placeholder="8 caractères minimum" autocomplete="current-password"
                 minlength="8" required>
        </div>

        <button class="bouton-principal" type="submit">Se connecter</button>
      </form>

      <p class="auth__lien-bascule">
        Pas de compte ? <a href="inscription.html">Inscrivez-vous</a>
      </p>
    </section>
  </main>
</body>
</html>
