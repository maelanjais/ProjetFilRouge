<!DOCTYPE html>
<!-- connexion.html — page de connexion : panneau d'accroche à gauche,
     formulaire de connexion à droite. -->
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description"
        content="Messagerie instantanée Web : échangez des messages en temps réel.">
  <title>Connexion - Messagerie</title>
</head>
<body>
  <main>
    <!-- Panneau d'accroche : nom du site et slogan -->
    <section>
      <header>
        <p>Messagerie</p>
      </header>
      <h1>Connectez-vous et</h1>
      <p>discutez sans interruptions</p>
    </section>

    <!-- Formulaire de connexion -->
    <section>
      <h2>Connexion</h2>

      <form>
        <div>
          <label for="courriel">Courriel</label>
          <input type="email" id="courriel" name="courriel"
                 placeholder="thomas@exemple.com" autocomplete="email" required>
        </div>

        <div>
          <label for="mot-de-passe">Mot de passe</label>
          <input type="password" id="mot-de-passe" name="mot-de-passe"
                 placeholder="8 caractères minimum" autocomplete="new-password"
                 minlength="8" required>
        </div>

        <button type="submit">Se connecter</button>
      </form>

      <p>Pas de compte ? <a href="inscription.html">Inscrivez-vous</a></p>
    </section>
  </main>
</body>
</html>
